name: stock_app
description: "A Flutter stock strategy analysis app for Taiwan stock market"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 網路請求
  dio: ^5.4.0
  
  # 狀態管理
  provider: ^6.1.1
  
  # UI 元件
  flutter_screenutil: ^5.9.0
  
  # 工具
  intl: ^0.19.0
  uuid: ^4.3.3
  
  # 本地儲存
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
